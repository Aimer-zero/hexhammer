[project]
name = "hexhammer"
version = "0.1.0"
description = "自主渗透·复现·攻防一体实战引擎"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13",
    "prompt_toolkit>=3",
    "impacket>=0.13.1",
]

[project.scripts]
hexhammer = "hexhammer.run.__main__:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# 只收集本仓测试;refs/ 是竞品 clone(自带测试,依赖未装,2026-09-24 实测干扰收集)
testpaths = ["tests"]
